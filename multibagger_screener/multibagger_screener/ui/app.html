<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Golden Stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
  /* theme before first paint, so a light-mode reader never sees a dark flash */
  (function () {
    var t = null;
    try { t = localStorage.getItem("gs-theme"); } catch (e) {}
    if (!t) t = (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>%%CSS%%</style>
</head>
<body>
<a class="sr-only" href="#main">Skip to content</a>
<div class="app">
  <aside class="rail" id="rail" aria-label="Main navigation"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="page" id="main" tabindex="-1"></main>
  </div>
</div>
<nav class="bottom-nav" id="bottomnav" aria-label="Main navigation"></nav>
<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Stock detail"></aside>
<div class="pal" id="pal" role="dialog" aria-modal="true" aria-label="Search">
  <div class="pal-box">
    <input id="palq" placeholder="Search a stock, or jump to a page…" autocomplete="off" spellcheck="false">
    <div class="pal-list" id="pallist"></div>
    <div class="pal-foot"><span><span class="kbd">↑↓</span> move</span><span><span class="kbd">Enter</span> open</span><span><span class="kbd">Esc</span> close</span></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="tip" id="tip"></div>
<script type="application/json" id="d-core">%%CORE%%</script>
<script type="application/json" id="d-ohlc">%%OHLC%%</script>
<script type="application/json" id="d-details">%%DETAILS%%</script>
<script type="application/json" id="d-fund">%%FUND%%</script>
<script type="application/json" id="d-news">%%NEWS%%</script>
<script type="application/json" id="d-penny">%%PENNY%%</script>
<script>%%JS%%</script>
</body>
</html>
