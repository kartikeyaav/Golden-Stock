name: Penny screen (cloud)

# The penny/nano-cap research screen on its OWN cadence — every 3 days rather
# than riding the Sunday weekly refresh (user request 2026-08-16).
#
# WHY IT CAN BE SPLIT OUT: the penny chain shares nothing with the weekly
# refresh's long pole. It builds its own universe from the NSE bhavcopy stack
# (whole cash market, ~2,500 EQ securities), scrapes its own fundamentals for
# names the main screener never touches, and writes its own journal. The
# weekly's expensive step — the screener.in scrape of the main shortlist — is
# irrelevant to it. weekly_refresh.py already ran the three steps with
# fatal=False, i.e. as an independent tail.
#
# WHY 3 DAYS AND NOT DAILY: the gates are computed over a 25-SESSION liquidity
# window and fundamentals are quarterly. Running it nightly would re-derive
# almost the same universe from almost the same data and add ~2,500 NSE
# requests a day for a screen that carries ZERO capital and has no backtest
# behind it. Three days moves the window enough to matter.
#
# GitHub cron has no "every 3 days" — `*/3` on day-of-month fires on the 1st,
# 4th, 7th ... 31st, so the turn of a month can give a 1- or 2-day gap. That
# is acceptable for a research surface and is noted rather than worked around.
# TWO SLOTS + A GUARD (2026-09-12): same reasoning as weekly.yml. The second
# slot only does anything on a day the first was dropped or failed.
on:
  schedule:
    - cron: "0 5 */3 * *"
    - cron: "0 11 */3 * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read      # notify_failure.py reads this run's own job/step status

# Shares the pipeline lock with daily/weekly: two jobs committing the forward
# record at once is how a rebase conflict gets written into a state file.
concurrency:
  group: golden-stock-pipeline
  cancel-in-progress: false

defaults:
  run:
    working-directory: multibagger_screener/multibagger_screener

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0        # commit DATES are the whole point of this job
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "manual run — screening regardless"
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=$(git log -1 --format=%ct -- state/penny_meta.json || echo 0)
          case "$last" in ''|*[!0-9]*) last=0 ;; esac
          now=$(date -u +%s)
          age=$(( (now - last) / 3600 ))
          echo "state/penny_meta.json last committed ${age}h ago"
          if [ "$last" -gt 0 ] && [ "$age" -lt 20 ]; then
            echo "today's penny screen is already in the record — no-op"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "no penny screen recorded for this cycle — running"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  penny:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install "pandas>=2.0" "numpy>=1.24"

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: |
            multibagger_screener/multibagger_screener/data_cache
            multibagger_screener/multibagger_screener/fundamentals_cache
            multibagger_screener/multibagger_screener/nse_cache
          key: golden-data-${{ github.run_id }}
          restore-keys: golden-data-

      # Each step is independently non-fatal in the weekly chain; keep that
      # here so a single NSE endpoint being down does not lose the whole run.
      - name: Penny universe (whole NSE + tradability gates)
        run: python scripts/build_penny_universe.py
        continue-on-error: true

      - name: Penny fundamentals (capped, cache-aware)
        run: python scripts/penny_fundamentals.py --limit 150
        continue-on-error: true

      - name: Penny screen (rank + journal)
        run: python scripts/penny_scan.py

      - name: Commit the penny record
        run: |
          git config user.name "golden-stock-bot"
          git config user.email "actions@users.noreply.github.com"
          for p in penny_universe.csv penny_ranked.csv penny_report.md \
                   penny_excluded.csv state/penny_details.json \
                   state/penny_meta.json journal/penny_journal.csv; do
            git add -f -- "$p" 2>/dev/null || echo "skip $p (absent)"
          done
          if git diff --cached --quiet; then
            echo "no penny changes to commit"
          else
            git commit -m "cloud: penny screen $(date -u +%Y-%m-%dT%H:%MZ)"
            # a conflicted rebase used to be swallowed by `|| true`, after
            # which the push failed for a reason nobody could see. Abort and
            # retry once, then let the push fail loudly — the failure step
            # below now says so out loud.
            if ! git pull --rebase --autostash origin master; then
              echo "rebase failed — aborting it and retrying once"
              git rebase --abort || true
              if ! git pull --rebase --autostash origin master; then
                echo "still cannot rebase; the push below will fail and report"
              fi
            fi
            git push origin HEAD:master
          fi

      # THE ONE STEP THAT RUNS WHEN THE JOB DOES NOT (2026-09-12) — everything
      # else that reports sits after the work inside this same job, so a crash
      # skips its own announcers. See the longer note in daily.yml.
      - name: Say it broke (failure only)
        if: ${{ failure() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/notify_failure.py "Penny screen" || true
