name: Daily scan (cloud)

# Runs the mechanical daily pipeline in the cloud so it fires 365 nights
# regardless of whether the laptop is on. 18:35 IST = 13:05 UTC, Mon-Fri
# (NSE trading days). Also runnable on demand via the "Run workflow" button.
#
# FOUR CRONS, NOT ONE (2026-08-31). GitHub's scheduler is best-effort: it
# delays crons under load and it drops them outright. This repo's own history
# is the evidence — the daily run fired ~45 min late through mid-August, ~10 h
# late on 08-27 and 08-28 (created 22:5x UTC for a 13:05 cron), and on Mon
# 08-31 it never fired at all. Nothing downstream noticed, because the
# dashboard is rebuilt BY this job: no run means no rebuild, so the published
# page just kept showing Friday's prices. A single cron is a single point of
# failure for the whole system's freshness.
#
# The retries are safe because daily_scan.py is idempotent within a session:
# transitions are diffed against the SAVED tag state (which the first run of
# the day advances) and BUY TRIGGER/EP events are keyed on the price bar, so a
# second pass finds nothing new. Safe, but not free — a second pass would
# rewrite daily_alerts.md with an empty list and blank the day's alerts. So the
# guard job below makes the catch-ups a genuine no-op rather than a re-run.
#
# All four slots sit inside the SAME UTC DAY (NSE closes 15:30 IST = 10:00
# UTC), which is what lets the guard compare against a plain UTC date. Do not
# add a slot that crosses midnight UTC without changing the guard with it.
on:
  schedule:
    - cron: "5 13 * * 1-5"   # 18:35 IST — the intended slot
    - cron: "5 16 * * 1-5"   # +3h  catch-up
    - cron: "5 19 * * 1-5"   # +6h  catch-up
    - cron: "5 22 * * 1-5"   # +9h  last chance before the UTC day turns over
  workflow_dispatch: {}

# allow the job to commit the forward record back to the repo
permissions:
  contents: write

# daily and weekly must never run at the same time (they share the cache and
# both push) — one at a time, queued
concurrency:
  group: golden-stock-pipeline
  cancel-in-progress: false

defaults:
  run:
    working-directory: multibagger_screener/multibagger_screener

jobs:
  # Has today's scan already landed? state/tags_state.json carries the date of
  # the run that wrote it and is committed by the scan job below, so the
  # committed record — not a runner-local file, not the Actions cache — is the
  # thing being asked. Checks out master rather than the triggering SHA on
  # purpose: a scheduled run is created against the tip as it was when the
  # cron fired, which for a catch-up is exactly the commit we need to see.
  #
  # workflow_dispatch always runs. When the user presses the button they mean
  # it, and --force-style re-runs are how a broken record gets rebuilt.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - id: check
        working-directory: multibagger_screener/multibagger_screener
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "manual run — scanning regardless"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # THE SESSION THIS RUN IS FOR, not the calendar date (fixed
          # 2026-09-01 after run #58 proved the difference). The first version
          # compared against `date -u +%F`, which assumed a cron fires inside
          # the UTC day it was scheduled in. GitHub does not promise that: the
          # Mon 22:05 slot was DELIVERED at 01:06 UTC Tuesday, the guard saw
          # today=09-01 against a stamp of 08-31, called it a new day and
          # re-scanned — replacing Monday's eight alerts with a different
          # nineteen. Exactly the damage the guard exists to prevent, caused by
          # the guard.
          #
          # NSE closes 15:30 IST = 10:00 UTC. So before 10:00 UTC the session
          # in play is still the previous weekday's, however late the cron was.
          # SCAN_NOW lets the test suite drive this exact shell at a chosen
          # instant instead of reimplementing the rule in Python and testing
          # the reimplementation. Unset in production, where it means "now".
          NOW="${SCAN_NOW:-now}"
          today=$(date -u -d "$NOW" +%F); dow=$(date -u -d "$NOW" +%u)
          hour=$((10#$(date -u -d "$NOW" +%H)))
          if [ "$hour" -ge 10 ] && [ "$dow" -le 5 ]; then
            target="$today"
          else
            i=1
            while :; do
              target=$(date -u -d "$today -$i day" +%F)
              [ "$(date -u -d "$target" +%u)" -le 5 ] && break
              i=$((i + 1))
            done
          fi
          # Read with grep, NOT with an interpreter. This job deliberately has
          # no setup-python step, and bare `python` is not on PATH on GitHub's
          # ubuntu runners (only `python3`) — so a `python -c` read here fails,
          # the `|| echo ""` catches it, and the guard silently answers "run"
          # every single time. It would have looked correct, passed review, and
          # let all four crons do a full scan; the late ones would then rewrite
          # daily_alerts.md empty. A guard that cannot say "skip" is decorative.
          #
          # save_state() writes {"date": "...", "tags": {...}} with date first,
          # and the tag VALUES are bare stage names, so this key is unambiguous.
          # A missing or unparseable file yields "" — which cannot equal a real
          # date, so the job SCANS. Absent data must never buy a night off.
          have=$(grep -o '"date"[[:space:]]*:[[:space:]]*"[0-9][0-9-]*"' \
                   state/tags_state.json 2>/dev/null \
                 | head -1 | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' || true)
          echo "tags_state='$have'  now(UTC)=$today ${hour}h dow=$dow  session=$target"
          if [ "$have" = "$target" ]; then
            echo "the $target session is already in the record — catch-up is a no-op"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "no scan recorded for the $target session — running"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  scan:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # secrets surfaced as plain env so `if:` can test them (secrets can't be
      # read directly in step conditions). Empty string when the secret is unset.
      # NOTE: ANTHROPIC_API_KEY deliberately NOT surfaced (2026-07-20, user
      # decision) — the cloud runs ZERO AI. Nightly deep-dives run on the
      # laptop's subscription via scripts/nightly_analyst_local.py (pooled).
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Optional friends' channel (2026-08-18). Unset -> send_telegram simply
      # skips the public message. It MUST be surfaced here: an unsurfaced
      # secret is indistinguishable from "no channel configured", so the
      # public feed would silently never fire in the only place that runs.
      TELEGRAM_PUBLIC_CHAT_ID: ${{ secrets.TELEGRAM_PUBLIC_CHAT_ID }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install "pandas>=2.0" "numpy>=1.24"

      # NSE_CACHE IS IN THIS LIST DELIBERATELY (added 2026-08-18). All three
      # workflows share one key lineage (`golden-data-` + restore-keys), so
      # whatever a job SAVES is what the next job RESTORES. This job does not
      # build nse_cache, but it does READ it (surveillance_snapshot.py ->
      # data/nse_all.py), and omitting it here meant every nightly run saved a
      # cache with the directory stripped out — 20.5 MB where weekly/penny save
      # 31 MB. The next penny/weekly run then refetched the whole NSE bhavcopy
      # stack from scratch, and surveillance re-hit the ASM/GSM endpoints every
      # single night. Keep the three path lists identical across daily.yml,
      # weekly.yml and penny.yml.
      # persist the price + fundamentals caches between runs. Unique key each
      # run always saves a fresh copy; restore-keys pulls the most recent prior
      # one (the standard mutable-cache pattern). A cache miss (first run / rare
      # eviction) triggers a full backfill — slow that once, then incremental.
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: |
            multibagger_screener/multibagger_screener/data_cache
            multibagger_screener/multibagger_screener/fundamentals_cache
            multibagger_screener/multibagger_screener/nse_cache
          key: golden-data-${{ github.run_id }}
          restore-keys: golden-data-

      - name: Daily scan (prices + tag + diff + alerts + journal)
        run: python scripts/daily_scan.py

      # AI analyst step REMOVED (2026-07-20, user decision): dives run on the
      # laptop's subscription (scripts/nightly_analyst_local.py, pooled across
      # nights the laptop is off) — the cloud never spends API credits.

      - name: Paper book + forward outcomes
        run: |
          python scripts/paper_trader.py || echo "paper degraded (non-fatal)"
          python scripts/journal_outcomes.py || echo "outcomes degraded (non-fatal)"

      # exchange surveillance (ASM/GSM/circuit band/series) for the MAIN
      # universe — display-only exit risk, never a gate. Non-fatal: NSE
      # sometimes blocks datacenter IPs, and a missing snapshot renders as
      # UNKNOWN rather than clean.
      - name: Exit-risk surveillance
        run: python scripts/surveillance_snapshot.py || echo "surveillance degraded (non-fatal)"

      # the pre-registered capital gate (CAPITAL_GATE.md) — recomputed from
      # the append-only journal every night
      - name: Capital gate
        run: python scripts/gate_status.py || echo "gate degraded (non-fatal)"

      - name: Build dashboard + landing page
        run: |
          python scripts/build_dashboard.py
          python scripts/build_landing.py || echo "landing degraded (non-fatal)"

      - name: Telegram (only if configured)
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        run: python scripts/send_telegram.py || echo "telegram degraded (non-fatal)"

      # commit the small, durable FORWARD RECORD back to the repo (journal,
      # tonight's tag state = the diff baseline, alerts, positions). NOT the
      # 75MB caches (they live in actions/cache) and NOT dashboard.html (that
      # goes to Pages below — keeps git history lean).
      - name: Commit forward record
        run: |
          git config user.name "golden-stock-bot"
          git config user.email "actions@users.noreply.github.com"
          # add each path separately: git add aborts ALL staging if any one
          # pathspec matches nothing (e.g. analyst_health.json when the AI
          # step is skipped) — that silently dropped the whole forward record
          # news_pressure/themes are DERIVED (rebuilt from the archive + price
          # cache every run) but are committed anyway: the weekly committee
          # runs on the laptop off a git pull, and without state/themes.json
          # its briefing would silently lose the theme map.
          for p in journal state/tags_state.json state/alert_details.json \
                   state/analyst_health.json state/news_radar.json state/regime.json \
                   state/news_pressure.json state/themes.json \
                   state/macro_radar.json \
                   state/surveillance.json state/gate.json \
                   state/telegram_sent.json state/trigger_state.json \
                   daily_alerts.md \
                   announcements_archive.csv news_archive.csv \
                   paper_positions.csv; do
            # positions.csv and holdings.csv are NOT in this list. They are the
            # user's real book — removed from the repo 2026-08-04 at their
            # request (audit F5). `git add -f` overrides .gitignore, so leaving
            # them here would have re-committed them every night and silently
            # undone the removal. paper_positions.csv stays: it is notional and
            # it IS the forward test.
            git add -f -- "$p" 2>/dev/null || echo "skip $p (absent)"
          done
          if git diff --cached --quiet; then
            echo "no forward-record changes to commit"
          else
            git commit -m "cloud: daily run $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin master || true
            git push origin HEAD:master
          fi

      - name: Upload dashboard artifact (view/download from the run page)
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: multibagger_screener/multibagger_screener/dashboard.html
          retention-days: 14

# Pages publishing moved to its OWN workflow (.github/workflows/pages.yml,
# 2026-07-20): it triggers on this workflow's completion (workflow_run) so fresh
# nightly data still republishes, AND on any push to the landing/dashboard
# source so edits go live immediately without waiting for a scan. A single
# dedicated deployer avoids two workflows racing on the one Pages deployment.
